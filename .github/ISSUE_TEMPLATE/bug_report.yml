name: Bug report
description: Report a problem with parisek/twig-attribute.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "1.6.1"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: PHP and Twig versions
      placeholder: "PHP 8.3, Twig 3.27"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Show a Twig template or PHP snippet.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
