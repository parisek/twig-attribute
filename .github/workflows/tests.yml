name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}${{ matrix.twig && format(' / Twig {0}', matrix.twig) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only `include` entries: each one is its own leg. A `php` list plus
        # `include` would merge the Twig key into the existing PHP 8.4 leg.
        include:
          - php: "8.3"
          - php: "8.4"
          - php: "8.5"
          - php: "8.4"
            twig: "^4.0@alpha"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      - name: Widen the Twig constraint
        if: matrix.twig
        # Edits composer.json in the runner workspace only. Nothing is committed.
        run: composer require --no-update "twig/twig:${{ matrix.twig }}"
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist
      - name: PHPUnit
        run: vendor/bin/phpunit
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  composer:
    name: composer hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - name: Audit dependencies for known advisories
        run: composer audit --abandoned=report
      - name: composer.json is normalized
        run: composer normalize --dry-run

  cs:
    name: code style (PER-CS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer cs
